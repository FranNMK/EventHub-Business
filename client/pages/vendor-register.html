<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Registration - EventHub Business</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container">
            <div class="nav-brand">
                <i class="fas fa-calendar-check"></i>
                <span>EventHub Business</span>
            </div>
        </div>
    </nav>

    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-store auth-logo"></i>
                <h1>Register as Vendor</h1>
                <p>Set up your vendor profile to offer services</p>
            </div>

            <form id="vendorRegisterForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="companyName" class="form-label">Company Name *</label>
                    <input type="text" id="companyName" class="form-control" placeholder="Your Company Ltd." required>
                </div>
                <div class="form-group">
                    <label for="serviceType" class="form-label">Service Type *</label>
                    <select id="serviceType" class="form-control" required>
                        <option value="">Select service type...</option>
                        <option value="catering">Catering</option>
                        <option value="photography">Photography</option>
                        <option value="decoration">Decoration</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="technology">Technology / AV</option>
                        <option value="transportation">Transportation</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="vendorDescription" class="form-label">Company Description</label>
                    <textarea id="vendorDescription" class="form-control" rows="3" placeholder="Tell us about your company..."></textarea>
                </div>
                <div class="form-group">
                    <label for="contactEmail" class="form-label">Business Email</label>
                    <input type="email" id="contactEmail" class="form-control" placeholder="business@company.com">
                </div>
                <div class="form-group">
                    <label for="contactPhone" class="form-label">Business Phone</label>
                    <input type="tel" id="contactPhone" class="form-control" placeholder="+1234567890">
                </div>
                <div class="form-group">
                    <label for="website" class="form-label">Website</label>
                    <input type="url" id="website" class="form-control" placeholder="https://www.company.com">
                </div>
                <div class="form-group">
                    <label for="address" class="form-label">Business Address</label>
                    <input type="text" id="address" class="form-control" placeholder="123 Business Street">
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    <i class="fas fa-store"></i> Register as Vendor
                </button>
                <div class="alert alert-danger d-none" id="vendorRegisterError"></div>
            </form>

            <div class="auth-footer">
                <p><a href="dashboard.html">Skip for now</a></p>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script src="../js/utils/config.js"></script>
    <script src="../js/utils/helpers.js"></script>
    <script src="../js/utils/api.js"></script>
    <script src="../js/components/toast.js"></script>
    <script>
        document.getElementById('vendorRegisterForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                companyName: document.getElementById('companyName').value.trim(),
                serviceType: document.getElementById('serviceType').value,
                description: document.getElementById('vendorDescription').value.trim(),
                contactEmail: document.getElementById('contactEmail').value.trim(),
                contactPhone: document.getElementById('contactPhone').value.trim(),
                website: document.getElementById('website').value.trim(),
                address: document.getElementById('address').value.trim()
            };
            
            if (!data.companyName || !data.serviceType) {
                Toast.warning('Company name and service type are required');
                return;
            }
            
            try {
                const response = await ApiService.post('/vendors/register', data);
                if (response.success) {
                    Toast.success('Vendor profile created! Waiting for admin approval.');
                    setTimeout(() => window.location.href = 'dashboard.html', 1500);
                }
            } catch (error) {
                document.getElementById('vendorRegisterError').textContent = error.message;
                document.getElementById('vendorRegisterError').classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
